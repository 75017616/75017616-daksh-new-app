name: daksh_hybrid
description: "Daksh - Multi-Intelligence & Career Hybrid Mobile Platform"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Hybrid WebView & Bidirectional JavaScript Bridge
  flutter_inappwebview: ^6.1.5
  webview_flutter: ^4.10.0

  # Native UI, Charts & Icons
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0

  # AI Mentor & Generative AI (Gemini 2.5/Flash)
  google_generative_ai: ^0.4.6
  http: ^1.2.2

  # Device Hardware, Haptics & Local Storage
  shared_preferences: ^2.5.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  flutter_local_notifications: ^18.0.1
  pdf: ^3.11.2
  printing: ^5.13.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/web/
